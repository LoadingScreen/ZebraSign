# On every push to main: run the tests, build the pages from src/ and
# pages/, and publish them to GitHub Pages. A failing test stops the publish.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install test-only modules
        run: npm install --prefix "$RUNNER_TEMP/deps" sshpk@1 bcrypt-pbkdf@1
      - name: Test
        run: sh test/run-all.sh
        env:
          NODE_PATH: ${{ runner.temp }}/deps/node_modules
      - name: Build
        run: node build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
